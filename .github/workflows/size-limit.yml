name: Bundle Size Check

on:
    pull_request:
        branches:
            - main

permissions:
    contents: read
    pull-requests: write
    issues: write

jobs:
    size:
        runs-on: ubuntu-latest
        env:
            CI_JOB_NUMBER: 1
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Enable Corepack
              run: corepack enable

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'yarn'

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Build
              run: yarn build

            - name: Check bundle size
              shell: bash
              run: |
                  node <<'NODE'
                  const { execFileSync } = require('node:child_process');
                  const output = execFileSync('npx', ['size-limit', '--json'], { encoding: 'utf8' });
                  const results = JSON.parse(output);
                  console.log(output.trim());

                  const failed = results.filter((result) => !result.passed);
                  if (failed.length) {
                      console.error('\nBundle size checks failed:');
                      for (const result of failed) {
                          console.error(`- ${result.name}: ${result.size} bytes (limit ${result.sizeLimit})`);
                      }
                      process.exit(1);
                  }
                  NODE
